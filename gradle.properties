# ====== Mizu Launcher 工程配置 ======
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
kotlin.code.style=official

# 包名（改这里要同步 app/build.gradle.kts 的 namespace 与源码目录）
mizu.applicationId=com.mizulauncher

# 应用信息
mizu.appName=Mizu Launcher
mizu.versionName=2.0.0
mizu.versionCode=20000

# PojavLauncher 上游（作为启动内核子模块引入）
pojav.repository=https://github.com/PojavLauncherTeam/PojavLauncher.git
pojav.branch=v3_openjdk

# 签名：留空即产出未签名包；CI 用 -P 参数或环境变量覆盖
# mizu.storeFile=
# mizu.storePassword=
# mizu.keyAlias=
# mizu.keyPassword=
